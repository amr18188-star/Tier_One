services:
  postgres:
    image: postgres:18
    container_name: tier1-dev-postgres
    environment:
      POSTGRES_DB: tier1
      POSTGRES_USER: tier1_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/dev-setup.ps1 first to generate .env}
      TZ: Africa/Cairo
      PGTZ: Africa/Cairo
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5440}:5432"
    volumes:
      - tier1_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tier1_dev -d tier1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Audit logs (hash-chained). No authentication in development.
  mongo:
    image: mongo:8
    container_name: tier1-dev-mongo
    ports:
      - "127.0.0.1:${MONGO_PORT:-27031}:27017"
    volumes:
      - tier1_mongodata:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  tier1_pgdata:
  tier1_mongodata:
