# Option 1: the API and the web UI run INSIDE Docker next to the infrastructure services.
#
#   docker compose -p tier1-dev -f docker-compose.dev.yml up
#   docker compose -p tier1-dev -f docker-compose.dev.yml --profile demo up     # the same, and loads the demo data
#
# `include` pulls in docker-compose.yml, so the same Postgres / Mongo containers and
# volumes are shared with Option 2 (API via `dotnet run`).
# The repository is bind-mounted; `dotnet watch` inside the container picks up every
# saved file and Vite hot-reloads the UI, so a code change needs NO image rebuild.
# All development settings and passwords are hard-coded below; no setup script is needed.
include:
  - docker-compose.yml

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: tier1-api:dev
    container_name: tier1-dev-api
    # `dotnet watch` exits when its polling watcher fails (it did on a local build writing into the shared tree, now moved
    # to artifacts/); the container then comes back by itself. A deliberate `stop` or `down` is not undone.
    restart: on-failure:5
    ports:
      - "127.0.0.1:5150:5150"   # loopback only: Development enables demo accounts and no MFA
    environment:
      # ASPNETCORE_HTTP_PORTS, not ASPNETCORE_URLS: StartupGuards rejects non-loopback
      # URLS in Development, but a container must listen on all its addresses.
      ASPNETCORE_HTTP_PORTS: "5150"
      # Inside the Compose network the services are reached by name on their internal ports.
      ConnectionStrings__Tier1: Host=postgres;Port=5432;Database=tier1;Username=tier1_dev;Password=tier1_dev
      ConnectionStrings__Mongo: mongodb://mongo:27017/tier1_logs
      ConnectionStrings__MongoAdmin: mongodb://mongo:27017/
      MongoLogs__SetupOnStartup: "true"
      MongoLogs__ChainKey: ybMmZEAJWMsrFElpEXuzGX81cfjMp1jnFHpxbzNRqgk=            # dev-only key
      PersonalData__IndexKey: MsA9ejls1XnhQF5T+CIEzM3f6F/14Lwq5Ny5e8Cryc4=          # dev-only key (national ID fingerprint)
      Seed__Demo: "true"                    # demo accounts *@tier1.local
      Seed__Structure: "true"               # the official university structure for new databases
      Seed__DemoPassword: Tier1-Demo-Pass1
      Auth__RequireMfa: "false"             # Development only
      Cookies__Secure: "false"
      RateLimiting__LoginPerMinute: "600"
      RateLimiting__SensitivePerMinute: "2000"
      App__PublicUrl: http://localhost:5188
      Email__From: tier1@capu.local
      DataProtection__KeysPath: /data/keys
      Files__Root: /data/files
      MongoLogs__CheckpointDirectory: /data/checkpoints
      Email__PickupDirectory: /work/repo/data/mail     # .eml files appear in data\mail on the host
      # Linux hosts can switch to inotify for lower CPU: DOTNET_USE_POLLING_FILE_WATCHER: "0"
    volumes:
      - .:/work/repo                              # live source tree
      - tier1_api_out:/work/out                   # bin/ + obj/ of every project
      - tier1_api_nuget:/root/.nuget/packages     # NuGet cache, survives restarts
      - tier1_api_data:/data                      # data-protection keys, files, checkpoints
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    stdin_open: true
    tty: true

  # Demo data (cycles, forms, values, college structures) through the API once it answers, with each role's demo account;
  # it skips itself when the data is already there. ARCH-4: a tool beside the server, not a job inside it. Its own build
  # output and NuGet cache, so its build never collides with `dotnet watch` in the api container: on a fresh environment both
  # restore at once, and two restores writing one package folder left half-extracted packages that broke both builds.
  # Opt-in (`--profile demo`): a plain `up` never loads it, so a database that holds real targets and entries is not filled
  # with generated cycles and "each college" targets by starting the environment. The E2E environment always loads it.
  demo-data:
    profiles: ["demo"]
    image: tier1-api:dev
    container_name: tier1-dev-demo-data
    command: ["dotnet", "run", "--project", "tools/Tier1.Tools", "--no-launch-profile", "--",
              "--demo-data", "--base", "http://api:5150", "--wait", "1200"]
    environment:
      DOTNET_ENVIRONMENT: Development
      ArtifactsPath: /work/out-tools
      Seed__DemoPassword: Tier1-Demo-Pass1
    volumes:
      - .:/work/repo
      - tier1_tools_out:/work/out-tools
      - tier1_tools_nuget:/root/.nuget/packages
    depends_on:
      - api
    restart: "no"

  # Vite dev server for the UI; proxies /api to the api service.
  web:
    image: node:24-bookworm-slim
    container_name: tier1-dev-web
    working_dir: /work/repo/web
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0"
    ports:
      - "127.0.0.1:5188:5188"
    environment:
      VITE_API_TARGET: http://api:5150
      VITE_USE_POLLING: "1"
    volumes:
      - .:/work/repo
      - tier1_web_node_modules:/work/repo/web/node_modules   # Linux packages, apart from the Windows node_modules
    depends_on:
      - api

volumes:
  tier1_api_out:
  tier1_tools_out:
  tier1_tools_nuget:
  tier1_api_nuget:
  tier1_api_data:
  tier1_web_node_modules:
