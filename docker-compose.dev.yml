# Option 1: the API and the web UI run INSIDE Docker next to the infrastructure services.
#
#   docker compose -p tier1-dev -f docker-compose.dev.yml up
#
# `include` pulls in docker-compose.yml, so the same Postgres / Mongo containers and
# volumes are shared with Option 2 (API via `dotnet run`).
# The repository is bind-mounted; `dotnet watch` inside the container picks up every
# saved file and Vite hot-reloads the UI, so a code change needs NO image rebuild.
# Run scripts/dev-setup.ps1 once first (generates .env and appsettings.Development.json).
include:
  - docker-compose.yml

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: tier1-api:dev
    container_name: tier1-dev-api
    ports:
      - "127.0.0.1:5150:5150"   # loopback only: Development enables demo accounts and no MFA
    environment:
      # ASPNETCORE_HTTP_PORTS, not ASPNETCORE_URLS: StartupGuards rejects non-loopback
      # URLS in Development, but a container must listen on all its addresses.
      ASPNETCORE_HTTP_PORTS: "5150"
      # Inside the Compose network the services are reached by name on their internal
      # ports; these override the host addresses in appsettings.Development.json.
      ConnectionStrings__Tier1: Host=postgres;Port=5432;Database=tier1;Username=tier1_dev;Password=${POSTGRES_PASSWORD:?run scripts/dev-setup.ps1 first}
      ConnectionStrings__Mongo: mongodb://mongo:27017/tier1_logs
      ConnectionStrings__MongoAdmin: mongodb://mongo:27017/
      # Windows paths from appsettings.Development.json do not exist in the container.
      DataProtection__KeysPath: /data/keys
      Files__Root: /data/files
      MongoLogs__CheckpointDirectory: /data/checkpoints
      Email__PickupDirectory: /work/repo/data/mail     # .eml files appear in data\mail on the host
      # Linux hosts can switch to inotify for lower CPU: DOTNET_USE_POLLING_FILE_WATCHER: "0"
    volumes:
      - .:/work/repo                              # live source tree
      - tier1_api_out:/work/out                   # bin/ + obj/ of every project
      - tier1_api_nuget:/root/.nuget/packages     # NuGet cache, survives restarts
      - tier1_api_data:/data                      # data-protection keys, files, checkpoints
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    stdin_open: true
    tty: true

  # Vite dev server for the UI; proxies /api to the api service.
  web:
    image: node:24-bookworm-slim
    container_name: tier1-dev-web
    working_dir: /work/repo/web
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0"
    ports:
      - "127.0.0.1:5188:5188"
    environment:
      VITE_API_TARGET: http://api:5150
      VITE_USE_POLLING: "1"
    volumes:
      - .:/work/repo
      - tier1_web_node_modules:/work/repo/web/node_modules   # Linux packages, apart from the Windows node_modules
    depends_on:
      - api

volumes:
  tier1_api_out:
  tier1_api_nuget:
  tier1_api_data:
  tier1_web_node_modules:
